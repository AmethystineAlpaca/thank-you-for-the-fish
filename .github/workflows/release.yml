name: Release macOS

on:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['.github/release-request.json']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag (for example v0.5.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-macos
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.INPUT_TAG || (process.env.GITHUB_REF_TYPE === 'tag'
            ? process.env.GITHUB_REF_NAME : require('./.github/release-request.json').tag);
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Expected a stable vX.Y.Z tag');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - name: Check out the exact tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: release-source/package-lock.json
      - name: Install locked dependencies
        working-directory: release-source
        run: npm ci
      - name: Test, package and checksum
        working-directory: release-source
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node "$GITHUB_WORKSPACE/scripts/release.js"
      - name: Publish only after both assets are uploaded
        working-directory: release-source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          notes="docs/releases/$RELEASE_TAG.md"
          test -s "$notes"
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if [ "$(node -p 'JSON.parse(require("fs").readFileSync("release-state.json")).isDraft')" != true ]; then
              echo 'Release is already public; its assets will not be replaced.'
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$(head -n 1 "$notes" | sed 's/^# //')" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" dist/thank-you-for-the-fish-macos-arm64.zip dist/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
